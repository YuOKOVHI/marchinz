<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Privacy: 顔に自動でモザイク">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3ff"/>
      <stop offset="1" stop-color="#f7f9ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#pbg)"/>

  <!-- 写真フレーム -->
  <rect x="60" y="30" width="280" height="190" rx="14" fill="#ffffff" stroke="#c9d6ee" stroke-width="2"/>
  <rect x="72" y="42" width="256" height="140" rx="8" fill="#dfe8fb"/>

  <!-- ステージの床 -->
  <path d="M72 152 L328 152 L328 182 L72 182 Z" fill="#aabde0" opacity="0.5"/>

  <!-- 人物1(左): 顔にモザイク -->
  <g>
    <path d="M120 182 L120 132 Q120 116 136 116 Q152 116 152 132 L152 182" fill="#0f2138"/>
    <!-- モザイク顔 -->
    <g>
      <rect x="122" y="78" width="14" height="14" fill="#4d7ce8"/>
      <rect x="136" y="78" width="14" height="14" fill="#93aef0"/>
      <rect x="122" y="92" width="14" height="14" fill="#93aef0"/>
      <rect x="136" y="92" width="14" height="14" fill="#1e4fd6"/>
      <rect x="129" y="85" width="14" height="14" fill="#c9d6ee" opacity="0.7"/>
    </g>
  </g>

  <!-- 人物2(中央): 顔にモザイク -->
  <g>
    <path d="M186 182 L186 128 Q186 112 203 112 Q220 112 220 128 L220 182" fill="#33415c"/>
    <g>
      <rect x="188" y="72" width="16" height="16" fill="#1e4fd6"/>
      <rect x="204" y="72" width="16" height="16" fill="#93aef0"/>
      <rect x="188" y="88" width="16" height="16" fill="#93aef0"/>
      <rect x="204" y="88" width="16" height="16" fill="#4d7ce8"/>
      <rect x="196" y="80" width="16" height="16" fill="#c9d6ee" opacity="0.7"/>
    </g>
  </g>

  <!-- 人物3(右): 検出枠が走っている途中 -->
  <g>
    <path d="M254 182 L254 134 Q254 118 269 118 Q284 118 284 134 L284 182" fill="#0f2138" opacity="0.85"/>
    <circle cx="269" cy="94" r="15" fill="#f3c6a5"/>
    <g stroke="#1e4fd6" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M248 84 L248 76 L256 76"/>
      <path d="M282 76 L290 76 L290 84"/>
      <path d="M290 104 L290 112 L282 112"/>
      <path d="M256 112 L248 112 L248 104"/>
    </g>
  </g>

  <!-- 自動検出バッジ -->
  <g>
    <rect x="228" y="192" width="100" height="20" rx="10" fill="#1e4fd6"/>
    <text x="278" y="206" text-anchor="middle" font-family="-apple-system,'Hiragino Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">顔を自動検出</text>
  </g>
</svg>
