<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="ReAngle: 斜め撮りを正面視点に補正">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3ff"/>
      <stop offset="1" stop-color="#f7f9ff"/>
    </linearGradient>
    <linearGradient id="floorA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d6ee"/>
      <stop offset="1" stop-color="#aabde0"/>
    </linearGradient>
    <linearGradient id="floorB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d7ce8"/>
      <stop offset="1" stop-color="#1e4fd6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>

  <!-- Before: 斜めから見た床(台形+歪んだグリッド) -->
  <g>
    <path d="M38 178 L86 78 L166 78 L178 178 Z" fill="url(#floorA)" opacity="0.9"/>
    <g stroke="#ffffff" stroke-width="2" opacity="0.75" fill="none">
      <path d="M62 128 L172 128"/>
      <path d="M50 153 L175 153"/>
      <path d="M74 103 L169 103"/>
      <path d="M104 78 L118 178"/>
      <path d="M132 78 L148 178"/>
    </g>
    <circle cx="96" cy="140" r="7" fill="#0f2138"/>
    <circle cx="128" cy="115" r="6" fill="#0f2138" opacity="0.75"/>
    <circle cx="146" cy="146" r="6.5" fill="#0f2138" opacity="0.85"/>
    <text x="108" y="206" text-anchor="middle" font-family="-apple-system,'Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#68738a">ななめ</text>
  </g>

  <!-- 矢印 -->
  <g stroke="#1e4fd6" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M196 128 L226 128"/>
    <path d="M218 119 L228 128 L218 137"/>
  </g>

  <!-- After: 正面の整った床 -->
  <g>
    <rect x="244" y="78" width="118" height="100" rx="6" fill="url(#floorB)"/>
    <g stroke="#ffffff" stroke-width="2" opacity="0.55" fill="none">
      <path d="M244 111 L362 111"/>
      <path d="M244 144 L362 144"/>
      <path d="M283 78 L283 178"/>
      <path d="M322 78 L322 178"/>
    </g>
    <circle cx="278" cy="140" r="7" fill="#ffffff"/>
    <circle cx="305" cy="112" r="6" fill="#ffffff" opacity="0.9"/>
    <circle cx="330" cy="148" r="6.5" fill="#ffffff" opacity="0.95"/>
    <text x="303" y="206" text-anchor="middle" font-family="-apple-system,'Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#1e4fd6">正面</text>
  </g>
</svg>
