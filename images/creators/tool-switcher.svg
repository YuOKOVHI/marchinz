<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Switcher: 複数カメラを同期して自動スイッチング">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3ff"/>
      <stop offset="1" stop-color="#f7f9ff"/>
    </linearGradient>
    <linearGradient id="mainCam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d7ce8"/>
      <stop offset="1" stop-color="#1e4fd6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#sbg)"/>

  <!-- 3つのソース(左) -->
  <g font-family="-apple-system,'Hiragino Sans',sans-serif" font-weight="700">
    <g>
      <rect x="36" y="34" width="92" height="54" rx="8" fill="#ffffff" stroke="#c9d6ee" stroke-width="2"/>
      <circle cx="70" cy="60" r="8" fill="#aabde0"/>
      <path d="M52 78 Q70 64 88 78 L110 78 Q96 68 112 60" stroke="#aabde0" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="44" y="49" font-size="10" fill="#68738a">CAM 1</text>
    </g>
    <g>
      <rect x="36" y="98" width="92" height="54" rx="8" fill="#dfe8fb" stroke="#1e4fd6" stroke-width="2.5"/>
      <circle cx="82" cy="122" r="9" fill="#1e4fd6"/>
      <path d="M60 142 Q82 126 104 142" stroke="#1e4fd6" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <text x="44" y="113" font-size="10" fill="#1e4fd6">CAM 2</text>
      <circle cx="118" cy="107" r="4" fill="#e0245e"/>
    </g>
    <g>
      <rect x="36" y="162" width="92" height="54" rx="8" fill="#ffffff" stroke="#c9d6ee" stroke-width="2"/>
      <rect x="58" y="180" width="12" height="22" rx="3" fill="#aabde0"/>
      <rect x="78" y="174" width="12" height="28" rx="3" fill="#aabde0"/>
      <rect x="98" y="186" width="12" height="16" rx="3" fill="#aabde0"/>
      <text x="44" y="177" font-size="10" fill="#68738a">CAM 3</text>
    </g>
  </g>

  <!-- 矢印 -->
  <g stroke="#1e4fd6" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M146 125 L176 125"/>
    <path d="M168 116 L178 125 L168 134"/>
  </g>

  <!-- 縦動画フレーム(右・メイン出力) -->
  <g>
    <rect x="212" y="26" width="112" height="198" rx="18" fill="#0f2138"/>
    <rect x="220" y="34" width="96" height="182" rx="11" fill="url(#mainCam)"/>
    <!-- 演者 -->
    <circle cx="268" cy="106" r="14" fill="#ffffff"/>
    <path d="M234 160 Q268 122 302 160" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- ワイプ -->
    <rect x="278" y="176" width="32" height="32" rx="6" fill="#ffffff"/>
    <circle cx="294" cy="188" r="5" fill="#1e4fd6"/>
    <path d="M285 202 Q294 194 303 202" stroke="#1e4fd6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- LIVEバッジ -->
    <rect x="228" y="42" width="40" height="16" rx="8" fill="#e0245e"/>
    <text x="248" y="54" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#ffffff">AUTO</text>
  </g>

  <!-- 切替タイムライン(右下) -->
  <g>
    <rect x="340" y="60" width="14" height="42" rx="4" fill="#aabde0"/>
    <rect x="340" y="108" width="14" height="58" rx="4" fill="#1e4fd6"/>
    <rect x="340" y="172" width="14" height="34" rx="4" fill="#aabde0"/>
  </g>
</svg>
