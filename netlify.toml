# MarchinZ — 静的サイト（ビルドコマンド不要）
# デプロイ時の公開ルートはこのリポジトリ／フォルダの直下（index.html がある場所）

[build]
  command = "bash ./netlify_prebuild_refresh.sh"
  publish = "."

# Firebase Auth helper endpoints を Netlify 側でプロキシし、1st-party の同一オリジンに見せる
[[redirects]]
  from = "/__/auth/*"
  to = "https://marchinz-app.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# クライアント側ルート（#page 以外のパス）や誤 URL で 404 にならないよう SPA フォールバック。
# 実在する静的ファイルは Netlify の Shadowing で優先され、このルールは適用されない。
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# data.json は更新が多い想定。CDN・ブラウザのキャッシュは短めにしつつ配信
[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# P2: 静的ホストの最低限セキュリティヘッダー（CSP はインラインスクリプト都合で未設定）
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
