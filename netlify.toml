# MarchinZ — 静的サイト（ビルドコマンド不要）
# デプロイ時の公開ルートはこのリポジトリ／フォルダの直下（index.html がある場所）

[build]
  command = "bash ./netlify_prebuild_refresh.sh"
  publish = "."
  # 毎朝5時のbot(YouTube/note/digestデータのみのpush)ではビルドしない(クレジット節約)。
  # exit 0 = ビルドをスキップ。データ系以外に差分があるときだけビルドが走る。
  # スキップ中のデータ鮮度は marchinz-data-refresh.js が実行時にGitHubから直接取得して担保する。
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)data.json' ':(exclude)data.inline.js' ':(exclude)digest.inline.js' ':(exclude)marchinz-notes.inline.js' ':(exclude)youtube-list/'"

# イベント登録の「URLから仮入力」用サーバレス関数(CORS回避のためサーバ側でページを取得)
[functions]
  directory = "netlify/functions"

# Firebase Auth helper endpoints を Netlify 側でプロキシし、1st-party の同一オリジンに見せる
[[redirects]]
  from = "/__/auth/*"
  to = "https://marchinz-app.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# クライアント側ルート（#page 以外のパス）や誤 URL で 404 にならないよう SPA フォールバック。
# 実在する静的ファイルは Netlify の Shadowing で優先され、このルールは適用されない。
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# data.json は更新が多い想定。CDN・ブラウザのキャッシュは短めにしつつ配信
[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# クリエイターツール(v1.35): 顔検出モデルの MIME を明示(拡張子 .tflite は既定表が無い)
[[headers]]
  for = "/*.tflite"
  [headers.values]
    Content-Type = "application/octet-stream"

# クリエイターツールの vendor(MediaPipe WASM 約11MB 等)は不変に近いので長めにキャッシュ(帯域節約)
[[headers]]
  for = "/tools/privacy/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/tools/switcher/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/tools/reangle/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# P2: 静的ホストの最低限セキュリティヘッダー（CSP はインラインスクリプト都合で未設定）
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# 開発・検証画面は検索結果へ出さない。本番機能のクロールは妨げない。
[[headers]]
  for = "/tools/qa/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # microphone は self を許可(v1.35で修正): Days/TOP のチューナーが getUserMedia(audio) を使う。
    # 旧値 microphone=() は自オリジンも拒否するため、本番でマイクが常に失敗していた
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
