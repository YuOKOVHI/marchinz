# メディアページの紙もの2誌に新刊が出ていないかを見張る(2026-08-04 優さん指示)
#
#   Laundry Day!!          毎日  公式ページ(marching-matsuri.com)
#   マーチングエクスプレス21   毎日  Amazon の検索結果
#
# 毎日にできる理由(2026-08-04 優さん指示): 公開リポジトリなので Actions の実行時間は
# 無料。何もコミットしないので Netlify のビルドも走らず、クレジットも減らない。
#
# ★ サイトのファイルは一切書き換えない。見つけたら Issue を立てるだけ。
#   表紙画像だけは自動で取れないので、掲載は優さんが手で行う。
name: メディア更新チェック (Laundry Day!! / マーチングエクスプレス21)

on:
  schedule:
    # 毎日 05:00 JST (20:00 UTC)。2誌まとめて調べる
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "調べる対象"
        type: choice
        options: [all, laundry, express]
        default: all

permissions:
  contents: read
  issues: write

concurrency:
  group: media-update-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 毎日の巡回は2誌とも見る。手で回したとき(workflow_dispatch)だけ絞れる。
      - name: 対象を決める
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          # 毎日の巡回は2誌とも。手で回したときだけ入力で絞れる
          if [ -n "$SCHEDULE" ]; then target=all
          else target="${INPUT_TARGET:-all}"; fi
          # 想定の3語以外は受け付けない(run: へ値を渡す前にここで閉じる)
          case "$target" in
            all|laundry|express) ;;
            *) echo "知らない対象: $target" >&2; exit 1 ;;
          esac
          echo "対象: $target"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      # ★赤くなるのは「調べ方が壊れた」ときだけ(相手のページの作りが変わった等)。
      # 相手に弾かれただけの日は緑のまま(理由はログに必ず出る) ─ 毎日走るので、
      # 弾かれた日まで赤くすると失敗メールに埋もれて誰も見なくなる。
      # 「黙って“変わりなし”に見える」ことだけは絶対にさせない。
      - name: 更新チェック
        id: check
        env:
          TARGET: ${{ steps.pick.outputs.target }}
        run: python3 check_media_updates.py --target "$TARGET" --github-output

      - name: 新刊があれば Issue を立てる
        # always(): check が exit 2 で赤くなっても、見つけた新刊は必ず知らせる
        # (if に状態関数が無いと GitHub が暗黙に success() を AND してスキップするため)
        if: always() && steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.check.outputs.issue_title }}
        run: |
          # 同じ題の Issue が開いたままなら重ねて立てない(毎週鳴り続けるのを防ぐ)
          if gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "同じ Issue が開いています。何もしません: $TITLE"
            exit 0
          fi
          gh issue create --title "$TITLE" --body-file media-update-issue.md
