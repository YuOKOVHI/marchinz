# 毎日 JST 05:00 頃に YouTube Data API でリストを、note 公式 RSS で新着記事を更新し、
# 差分があれば main に push。Netlify が GitHub連携なら、この push で本番デプロイが走る。
#
# 事前準備（リポジトリ Settings → Secrets and variables → Actions）:
#   YOUTUBE_API_KEY … Google Cloud の YouTube Data API v3 用キー（リポジトリシークレット）
#   （note は公式 RSS を使うためキー不要）
#
# 手動実行: Actions タブ → 「YouTube + note daily refresh」→ Run workflow

name: YouTube + note daily refresh

on:
  schedule:
    # 20:00 UTC = 翌日 05:00 JST（DST なしの前提で運用）
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-api-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run YouTube API refresh
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: bash ./run_youtube_api_refresh.sh

      # note の新着フィード(キー不要)。取得失敗でも他の更新を止めない
      - name: Run note feed refresh
        run: python3 export_notes_feed.py || echo "note refresh skipped (fetch failed)"

      - name: Generate weekly digest (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 generate_weekly_digest.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "youtube-list/YouTubeリスト.csv" "youtube-list/youtube-list.inline.js" "data.json" "data.inline.js" "digest.inline.js" "marchinz-notes.inline.js"
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh YouTube list + note feed"
          git push
