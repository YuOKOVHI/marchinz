# 毎日 JST 05:00 頃に YouTube Data API でリストを、note 公式 RSS で新着記事を更新し、
# 差分があれば main に push。Netlify が GitHub連携なら、この push で本番デプロイが走る。
#
# 新着が無いときは何もしない:
#   - 各スクリプトは取得結果が同じならファイルを書き換えない
#     (ダイジェストは「直近7日」が動く窓のため、新着の顔ぶれを指紋で比べて
#      同じなら Gemini を呼ばずに既存を維持する)
#   - 最後の commit ステップも差分ゼロなら何もせず終了
#   → 新着ゼロの回は API 消費・コミット・push がいずれも発生しない
#
# 事前準備（リポジトリ Settings → Secrets and variables → Actions）:
#   YOUTUBE_API_KEY … Google Cloud の YouTube Data API v3 用キー（リポジトリシークレット）
#   （note は公式 RSS を使うためキー不要）
#
# 手動実行: Actions タブ → 「YouTube + note refresh (daily)」→ Run workflow

name: YouTube + note refresh (daily)

on:
  schedule:
    # 20:00 UTC = 翌日 05:00 JST
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-api-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run YouTube API refresh
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: bash ./run_youtube_api_refresh.sh

      # botのpush(GITHUB_TOKEN)では「Verify repo data」ワークフローが発火しない
      # (GitHubのループ防止)。生成したデータの整合はここで検証してからpushする
      - name: Verify refreshed data
        run: |
          python3 verify_youtube_list_csv_inline.py
          python3 check_data.py

      # note の新着フィード(キー不要)。取得失敗でも他の更新を止めない
      - name: Run note feed refresh
        run: python3 export_notes_feed.py || echo "note refresh skipped (fetch failed)"

      # 新着の顔ぶれが前回と同じなら Gemini を呼ばずスキップ(APIとコミットの節約)
      - name: Generate weekly digest (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 generate_weekly_digest.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false
          # ★列挙方式(allowlist)は載せ忘れを必ず生む。除外方式にする。
          #
          #   ここは run_youtube_api_refresh.sh 経由で sync_csv_to_json.py を
          #   呼ぶので、data.inline.js が変わると index.html と app.js の
          #   キャッシュキー(?v=)も書き換わる。ところが列挙には両方とも
          #   無かった。しかもこのワークフローは pull --rebase を使わないため
          #   **未ステージが残っても push は成功しジョブは緑のまま**で、
          #   「新しい data.inline.js + 古い ?v=」が本番へ出ていた
          #   (sync_csv_to_json.py 自身が警告している旧データ誤読の再発形)。
          #   2026-08-13 の三者レビューで発覚。POV側(videos-daily-update.yml)と
          #   同じ形へ揃える。
          #
          #   POV の正本・台帳はこのワークフローの担当外なので除外する。
          git add -u -- . \
            ':!大会動画リスト_POV.csv' \
            ':!pov_ledger.json' \
            ':!pov_channel_cursors.json'
          # 載せ残しがあれば、緑のまま本番を壊さずここで赤くして止める
          if ! git diff --quiet; then
            echo "::error::このワークフローが触らないはずのファイルが変更されています: $(git diff --name-only | tr '\n' ' ')"
            exit 1
          fi
          # 生成物の削除が紛れ込んでいないか(除外方式は入口が広い)
          if ! git diff --cached --diff-filter=D --quiet; then
            echo "::error::ファイルの削除が載っています: $(git diff --cached --diff-filter=D --name-only | tr '\n' ' ')"
            exit 1
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh YouTube list + note feed"
          git push

      # チャンネルのハンドル変更・削除でリンクが切れていないか確かめる。
      # export_youtube_list_via_api.py は引けなかったチャンネルの行を静かに
      # 空にするだけなので、放っておくと中身の無いカードが並ぶことに誰も
      # 気づけない(2026-07-21、ICHIKASHI ALUMNI CGT のハンドル変更で発生)。
      # データの更新と push が済んだ後に走らせ、切れていればこのジョブを
      # 失敗させて GitHub から通知が届くようにする。
      - name: Check channel links
        run: python3 check_channel_links.py --quiet
