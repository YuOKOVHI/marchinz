# POV（奏者視点）だけを毎日見張り、確実な新着だけを自動反映する。
#
# 対象は「大会動画リスト_POV.csv」とPOV台帳、その2つから生成する data.json / data.inline.js
# のみ。マーチング等・MIX3・海外のCSVには一切触れない。
#
# 自動採用: 収録実績のあるチャンネル × 題名にPOV/headcam等 × 楽器名 × 団体名 × 5〜20分。
# それ以外はIssueを立て、動画を見て人が採否を決める（無関係動画の混入を防ぐため）。
name: POV動画の自動更新

on:
  schedule:
    # 毎日 00:00 JST (15:00 UTC)
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "公開日を何日前まで遡るか（手動実行用）"
        type: choice
        options: [1, 4]
        default: "1"
      dry_run:
        description: "コミットしない(調べるだけ)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: pov-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: yt-dlp を入れる
        run: python3 -m pip install --quiet --upgrade yt-dlp

      - name: 探索期間を決める
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_LOOKBACK: ${{ github.event.inputs.lookback_days }}
          INPUT_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          export TZ=Asia/Tokyo
          today="$(date +%F)"
          if [ -n "$SCHEDULE" ]; then
            # 2026-08-12 00:00 JST の初回だけ、優さん指定の過去4日分を補足する。
            # 以後の定期実行は前日からの1日分。手動実行は下の入力で再実行できる。
            if [ "$today" = "2026-08-12" ]; then days=4; else days=1; fi
          else
            days="${INPUT_LOOKBACK:-1}"
          fi
          case "$days" in
            1|4) ;;
            *) echo "許可されない遡及日数: $days" >&2; exit 1 ;;
          esac
          since="$(date -d "$days days ago" +%F)"
          echo "since=$since" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "dry=${INPUT_DRY:-false}" >> "$GITHUB_OUTPUT"
          echo "POVのみ / 公開日下限: $since（過去${days}日） / dry-run: ${INPUT_DRY:-false}"

      - name: POVの新着を調べ、確実なものだけ入れる
        id: pov
        run: >-
          python3 check_pov_updates.py --since "${{ steps.pick.outputs.since }}"
          --auto-apply --github-output

      # ── 反映と検算 ──
      - name: POV配信元のチャンネル画像を補完する
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 enrich_video_source_logos.py --csv '大会動画リスト_POV.csv'

      - name: 派生ファイルを作り直して検算
        run: |
          python3 sync_csv_to_json.py
          python3 check_data.py

      - name: 変わったかを見る
        id: diff
        run: |
          if git diff --quiet -- '大会動画リスト_POV.csv' data.json data.inline.js pov_ledger.json index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "変更なし"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- '大会動画リスト_POV.csv' data.json data.inline.js pov_ledger.json index.html
          fi

      - name: コミットして反映する
        if: steps.diff.outputs.changed == 'true' && steps.pick.outputs.dry != 'true'
        env:
          APPLIED: ${{ steps.pov.outputs.applied }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ★POV正本と派生データだけを載せる。ほかの3分類のCSVは変更できない。
          git add '大会動画リスト_POV.csv' data.json data.inline.js pov_ledger.json index.html
          git commit -m "chore(pov): 日次更新（自動採用 ${APPLIED:-0}件）"
          # 毎朝5時のデータ更新botと同じ時間帯に走るので、衝突したら取り込み直す
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push に失敗（$i回目）。取り込み直して再試行します"
            sleep 10
          done
          echo "::error::3回試しても push できませんでした"
          exit 1

      - name: 人が見るべきPOV候補があれば Issue を立てる
        # always(): 前の段が赤くても、見つけた候補は必ず知らせる
        if: always() && steps.pov.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.pov.outputs.issue_title }}
        run: |
          # 開いている POV新着 Issue があれば追記し、毎日新しく積まない
          prev=$(gh issue list --state open --limit 50 \
                   --search "POV新着 in:title" --json number --jq '.[0].number // empty')
          if [ -n "$prev" ]; then
            gh issue comment "$prev" --body-file pov-update-issue.md
          else
            gh issue create --title "$TITLE" --body-file pov-update-issue.md
          fi

      - name: 候補の一覧を成果物として残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pov-candidates
          path: pov_candidates.tsv
          if-no-files-found: ignore
          retention-days: 30
