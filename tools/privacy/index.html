<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MarchinZ Privacy — 顔自動モザイク〈ベータ版〉</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle>
      <rect x="8" y="9" width="3" height="3" fill="currentColor" stroke="none"></rect>
      <rect x="13" y="9" width="3" height="3" fill="currentColor" stroke="none"></rect>
      <rect x="10.5" y="13.5" width="3" height="3" fill="currentColor" stroke="none"></rect>
    </svg>
    <h1>MarchinZ Privacy</h1>
    <span class="beta-badge">ベータ版</span>
  </div>
  <div class="head-right">
    <span id="statusPill" class="pill">読み込み中…</span>
    <a href="/#creators" class="back-link">← MarchinZへ</a>
  </div>
</header>

<main>
  <!-- ① 動画・写真を選ぶ -->
  <section id="dropSection" class="card drop">
    <p class="drop-title">動画や写真を選ぶと、顔に自動でモザイクがかかります</p>
    <button id="pickBtn" class="big-btn">動画・写真を選ぶ</button>
    <input id="fileInput" type="file" accept="video/*,image/*" hidden>
    <p class="note">すべてスマホ/PCの中だけで処理します。動画・写真はどこにも送信されません。無料です。</p>
  </section>

  <!-- ② プレビュー+設定+書き出し -->
  <section id="editorSection" hidden>
    <div class="card">
      <div class="clip-row">
        <span id="clipName" class="clip-name"></span>
        <button id="backBtn" class="text-btn">別の素材</button>
      </div>
      <div class="preview-wrap">
        <canvas id="previewCanvas"></canvas>
      </div>
      <div class="transport video-only">
        <button id="playBtn" class="mini-btn">▶ 再生</button>
        <input id="seekBar" type="range" min="0" max="100" step="0.01" value="0">
        <span id="timeLabel" class="time">0:00 / 0:00</span>
      </div>
    </div>

    <div class="card">
      <div class="setting">
        <label>隠しかた</label>
        <div id="typeSeg" class="seg">
          <button data-type="mosaic" class="on">モザイク</button>
          <button data-type="blur">ぼかし</button>
          <button data-type="fill">黒塗り</button>
        </div>
      </div>
      <div class="setting">
        <label>濃さ <b id="strengthVal"></b></label>
        <input id="strengthRange" type="range" min="1" max="10" step="1">
      </div>
      <div class="setting">
        <label>広げ幅 <b id="expandVal"></b></label>
        <input id="expandRange" type="range" min="0" max="100" step="5">
      </div>
      <div class="setting video-only">
        <label>顔を見失っても追いかける <b id="holdVal"></b></label>
        <input id="holdRange" type="range" min="0" max="5" step="0.5">
      </div>
      <div class="setting row">
        <label class="chk"><input id="deepChk" type="checkbox">小さな顔もていねいに探す</label>
        <select id="resSel" class="video-only">
          <option value="1080" selected>フルHDで保存(速い)</option>
          <option value="orig">元の解像度のまま</option>
        </select>
      </div>
    </div>

    <div class="card">
      <button id="exportBtn" class="big-btn accent">モザイクをかけて保存</button>
      <div id="progressWrap" hidden>
        <div class="bar"><div id="progressBar"></div></div>
        <p id="progressText" class="note"></p>
        <button id="cancelBtn" class="text-btn">中止する</button>
      </div>
      <div id="doneCard" hidden>
        <p id="doneText" class="done"></p>
        <button id="saveBtn" class="big-btn accent">📷 保存</button>
        <p id="doneNote" class="note"></p>
      </div>
    </div>
  </section>
</main>

<footer>
  <p>端末内で完結・無料 | MarchinZ クリエイターツール〈ベータ版〉 | <a href="/#creators" class="foot-link">MarchinZへ戻る</a></p>
</footer>

<div id="toast"></div>

<script src="vendor/mp4box.all.min.js"></script>
<script src="vendor/mp4-muxer.min.js"></script>
<script src="js/app.js"></script>
<script src="js/demux.js"></script>
<script src="js/tracker.js"></script>
<script src="js/detect.js"></script>
<script src="js/mosaic.js"></script>
<script src="js/preview.js"></script>
<script src="js/exporter.js"></script>
<script src="js/ui.js"></script>
<script type="module">
  import { FilesetResolver, FaceDetector } from "./vendor/tasks-vision.mjs";
  window.MZVision = { FilesetResolver, FaceDetector };
  window.dispatchEvent(new Event("mz-vision-ready"));
</script>
</body>
</html>
