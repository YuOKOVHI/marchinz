    /* 実物の drawOverlayMessage をオフスクリーンへ描かせ、
       ①返り値の寸法(輪と文字の位置)で「順序と重なり」を、
       ②画素の外接で「枠からのはみ出し」を測る */
    const draw = (W, H, spinner) => {
      const cv = w.document.createElement("canvas");
      cv.width = W; cv.height = H;
      const ctx = cv.getContext("2d", { willReadFrequently: true });
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
      const m = P.drawOverlayMessage.call({ canvas: cv, ctx, fitText: P.fitText },
        spinner ? "映像分析中..." : "ここは書き出されません",
        "3 / 3 本目・Timeline 1.mov",
        spinner ? { spinner: true, ratio: 0.87 } : undefined);
      const d = ctx.getImageData(0, 0, W, H).data;
      let x0 = W, x1 = 0, y0 = H, y1 = 0;
      for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) {
        if (d[(y * W + x) * 4] > 140) {
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
      return { m, x0, x1, y0, y1 };
    };
    const ratio = {};
    for (const [W, H, name] of [[1080, 1920, "9:16"], [1920, 1080, "16:9"]]) {
      const { m, x0, x1, y0, y1 } = draw(W, H, true);
      if (!m) throw new Error(name + ": 寸法が返らない(レイアウトの実測ができない)");
      /* 順序: 動画タイトル(補足) → 輪 → 説明。それぞれ触れない(重なりゼロ) */
      if (!(m.subY + m.subFont / 2 <= m.ringTop)) {
        throw new Error(`${name}: 動画タイトルが輪に重なる(下端${Math.round(m.subY + m.subFont / 2)} > 輪上端${Math.round(m.ringTop)})`);
      }
      if (!(m.titleY - m.titleFont / 2 >= m.ringBottom)) {
        throw new Error(`${name}: 説明の文字が輪に重なる(上端${Math.round(m.titleY - m.titleFont / 2)} < 輪下端${Math.round(m.ringBottom)})`);
      }
      /* 文字の上限(①): ゲージ拡大の係数をそのまま掛けた大きさ(基準の5%×F)より
         小さく抑えられていること。輪はFのまま大きい(ゲージと文字の独立) */
      if (m.titleFont > m.base * 0.058 + 1) throw new Error(`${name}: 説明の文字が上限超え ${m.titleFont}px`);
      if (m.F > 1.5 && m.titleFont >= Math.round(m.base * 0.05 * m.F)) {
        throw new Error(`${name}: 文字がゲージの係数のまま(上限が効いていない)`);
      }
      /* はみ出しゼロ(②): 白い画素が描画領域の外周2%より内側に収まる */
      if (x0 < W * 0.02 || x1 > W * 0.98 || y0 < H * 0.02 || y1 > H * 0.98) {
        throw new Error(`${name}: 枠からはみ出している(外接 x${x0}..${x1} y${y0}..${y1})`);
      }
      /* ゲージ自体は大きいまま(直径が短辺の3割前後) */
      const dia = (m.r * 2) / m.base;
      if (dia < 0.28 || dia > 0.5) throw new Error(`${name}: 輪の直径が短辺の${(dia * 100).toFixed(0)}%(縮んだ/膨れた)`);
      ratio[name] = { t: m.titleFont / W, s: m.subFont / W };
    }
    /* ★ 文字の見かけの大きさは、比率が同じなら**幅**に対して同じ(2026-08-04
       優さん実機指摘「縦動画だけ読み込み中の文字が大きい」)。
       base = min(W,H) は 9:16 も 16:9 もどちらも1080なので、短辺だけで
       上限を決めると両方まったく同じ絶対pxになり、画面幅に対応するのは W の
       ほうなので縦型でだけ1.78倍に見えていた。
       ★ 輪ではなく文字だけを見る ─ 輪は「特に縦型は大きく」の指示で
         わざと大きい(すぐ上の rp < rl の見張りがそれを守っている) */
    for (const k of ["t", "s"]) {
      const p = ratio["9:16"][k], l = ratio["16:9"][k];
      if (!(Math.abs(p - l) / l <= 0.12)) {
        throw new Error(`${k === "t" ? "説明" : "動画タイトル"}の文字が、幅に対して`
          + `縦型${(p * 100).toFixed(2)}% / 横型${(l * 100).toFixed(2)}% とずれている`
          + `(${(p / l).toFixed(2)}倍)`);
      }
    }
    /* 縦型のゲージは16:9より小さくない(「特に縦型は大きく」の据え置き) */
    const rp = draw(1080, 1920, true).m.r, rl = draw(1920, 1080, true).m.r;
    if (rp < rl) throw new Error(`縦型の輪(${Math.round(rp)})が16:9(${Math.round(rl)})より小さい`);
    /* 常設の案内(ゲージなし)は従来のまま拡大しない */
    const still = draw(1920, 1080, false);
    if (still.m) throw new Error("常設案内までゲージのレイアウトになっている");
    return "順序=タイトル→輪→説明 / 重なり0 / 文字上限あり / はみ出し0 / 輪は大きいまま";
  });

  await test("★機械候補は重なり区間の中・保険(fb-)だけ実長まで許す(2026-08-06 裁定)", async () => {

    w.MC.getClip(3).duration = 70;   // 共通部分 40〜70 = 30秒 < 59秒
    const r = U.applyLengthChoice();

  });

  await test("★書き出し中プレビューの<video>再生 — 消灯抑止の条件と、断られたらcanvasへ戻る", async () => {
    const w = await compEnv();
    compReset(w);
    const d = w.document, U = w.MC.ui, X = w.MC.exporter;
    const v = d.getElementById("eoLiveVid");
    if (!v) throw new Error("#eoLiveVid が無い");
    if (!d.getElementById("eoRun").contains(v)) throw new Error("#eoLiveVid が #eoRun の外にある");
    /* WebKit の消灯抑止(shouldDisableSleep)が効く条件(session.js の実読と同じ):
       muted でない・loop でない・playsinline。音の中身は無音トラックで賄う */
    if (v.hasAttribute("muted") || v.muted) throw new Error("muted になっている(WebKitは muted だと消灯を抑止しない)");
    if (v.loop || v.hasAttribute("loop")) throw new Error("loop になっている(WebKitは loop だと消灯を抑止しない)");
    if (!v.hasAttribute("playsinline")) throw new Error("playsinline が無い(iOSで全画面再生に化ける)");
    const el = d.getElementById("eoLive");
    const mk = () => { const c = d.createElement("canvas"); c.width = 108; c.height = 192;
      const x = c.getContext("2d"); x.fillStyle = "#f00"; x.fillRect(0, 0, 108, 192); return c; };
    const keepOn = U.eoLive.on;
    try {
      U.exportOverlay.open();
      /* ① <video>再生が生きていれば、表示は video・canvas は隠す(二重に出さない) */
      U.eoLive.on = true; X._liveAt = 0;
      X.livePreview(mk());
      if (v.hidden) throw new Error("動画版のプレビューが現れない");
      if (!el.hidden) throw new Error("canvas と動画が二重に出ている");
      /* ② 使えない環境では従来の canvas 表示に静かに戻る(機能検出) */
      U.eoLive.on = false; X._liveAt = 0;
      X.livePreview(mk());
      if (el.hidden) throw new Error("従来の canvas 表示に戻らない");
      /* ③ play() が断られたら on は立たない(壊さず canvas のまま) */
      const keepPlay = w.HTMLMediaElement.prototype.play;
      const keepStream = U.eoLive._stream, keepNoApi = U.eoLive._noApi;
      try {
        w.HTMLMediaElement.prototype.play = function () {
          return Promise.reject(Object.assign(new Error("denied"), { name: "NotAllowedError" }));
        };
        U.eoLive._stream = null; U.eoLive._noApi = false;
        await U.eoLive.prime();
        if (U.eoLive.on) throw new Error("play() が断られたのに再生中を名乗る");
      } finally {
        w.HTMLMediaElement.prototype.play = keepPlay;
        try { v.srcObject = null; } catch (_) {}
        U.eoLive._stream = keepStream; U.eoLive._noApi = keepNoApi;
      }
      /* ④ OS側の pause で「再生中」を名乗り続けない(凍ったコマを見せない)。
         listener は prime のストリーム作成時に付く ─ ③ が付けている。
         判定は prime と同じ機能検出(API の無い環境ではこの項だけ黙って飛ばす) */
      if (el.captureStream && (w.AudioContext || w.webkitAudioContext) && w.MediaStream) {
        U.eoLive.on = true;
        v.dispatchEvent(new w.Event("pause"));
        if (U.eoLive.on) throw new Error("OSに止められても on のまま(凍った<video>を見せ続ける)");
      }
      /* ⑤ stop() は AudioContext を眠らせる(書き出しの外で無音を鳴らし続けない)。
         変異: suspend を呼ばない実装ならここで検出する */
      { const keepCtx = U.eoLive._ctx;
        const fake = { state: "running", _s: false,
          suspend() { this._s = true; this.state = "suspended"; return Promise.resolve(); } };
        try {
          U.eoLive._ctx = fake;
          U.eoLive.stop();
          if (!fake._s) throw new Error("stop() が AudioContext を眠らせていない");
        } finally { U.eoLive._ctx = keepCtx; }
      }
      return "video=非muted/非loop/playsinline / on=videoだけ表示 / off=canvasへ / 拒否でも壊れない / pause=canvasへ / stop=ctx休止";
    } finally { U.eoLive.on = keepOn; U.exportOverlay.close(); }
  });

  await test("★音の判定の発火数を数える(実素材でしきい値を詰める根拠・変異つき)", async () => {
    /* +1.2 という全加点で最大の値を支えている pit 判定は、
       sections.js 自身が「発火しすぎの可能性がある側」と書いたまま
       合成素材でしか確かめられていない。実素材の数字を出す。
       ★ しきい値は読むたびに引く ─ 定数を配列へ写し取ると、
         TUTTI_WIDE を変えたときログだけが古い値を報告する */
    const w = await compEnv();
    const D = w.MC.director;
    const keepTW = D.TUTTI_WIDE;
    /* classify を差し替えて、狙った発火数になる音を作る。
       hop=1秒・10区間で、pit は3区間だけ 0.45 を超える */
    const keepCls = w.MC.sections.classify;
    const clip = { offset: 0, sections: { hop: 1, t: [], rms: [] } };
    try {
      let i = 0;
      w.MC.sections.classify = () => {
        const k = i++;
        /* ★ しきい値ちょうどを1区間ずつ混ぜる(2026-08-04 レビュー)。
           0.9/0.1 だけだと > と >= を入れ替えても数が変わらず、
           境界の扱いを一切測れない。
           pit は > 0.45(ちょうどは数えない) / full は >= 0.7(ちょうども数える) */
        if (k === 9) return { pit: 0.45, full: 0.7, feature: 0.1, percussion: 0.1 };
        return { pit: k < 3 ? 0.9 : 0.1, full: k < 5 ? 0.9 : 0.1,
                 feature: k < 1 ? 0.9 : 0.1, percussion: 0.1 };
      };
      const line = D._clsTally(clip, 0, 10);
      if (!/pit≧0\.45=3\/10\(30%/.test(line)) throw new Error("pitの数が合わない: " + line);
      /* full は >= なので、ちょうど0.7 の1区間も数える → 5+1=6 */
      if (!/full≧0\.7=6\/10\(60%/.test(line)) throw new Error("fullの数が合わない: " + line);
      if (!/feature≧0\.45=1\/10/.test(line)) throw new Error("featureの数が合わない: " + line);
      if (!/percussion≧0\.4=0\/10/.test(line)) throw new Error("percussionの数が合わない: " + line);
      /* 変異: しきい値を動かすと数が変わる(＝閾値を本当に見ている証明) */
      i = 0; D.TUTTI_WIDE = 0.05;
      const m = D._clsTally(clip, 0, 10);
      if (!/full≧0\.05=10\/10/.test(m)) throw new Error("TUTTI_WIDEを下げても数が変わらない: " + m);
      /* 解析が無ければ黙って測れないと言う(落とさない) */
      i = 0;
      if (!/測れず/.test(D._clsTally({ offset: 0 }, 0, 10))) throw new Error("解析なしで測れずと言わない");
      return "pit 3/10・full 5/10・feature 1/10・percussion 0/10 / "
        + "しきい値を動かすと数も動く / 解析なしは測れず";
    } finally { D.TUTTI_WIDE = keepTW; w.MC.sections.classify = keepCls; }
  });

       破れていた ─ _setupTab は門の外で黙って戻る:
         removeClip → resetEasyDone が _tabsForced を倒す
                    → refreshSetupTabs がタブを隠す
                    → その場で pro→easy へ降格 → 門が開く

         (ここを怠って ㊵ の2件を巻き添えにした) */
    const w = await compEnv();
    const d = w.document;
    const U = w.MC.ui;
    const keep = { flow: U._autoFlow, tab: U._setupTab, forced: U._tabsForced,
                   step: U._stepPhase, busy: U._busy, hold: U._repickHold,
                   view: U._viewPhase, open: U.openFinishPick, run: U.runAuto };
    let opened = 0;

      S.finishPicked = false; S.easyDone = false; U._repickHold = false;
      U.setBusy(false);
      if (U.needsFinishPick()) throw new Error("外す前から門が開いている(前提が崩れている)");
      U.openFinishPick = () => { opened++; };
      U.runAuto = () => {};
      w.MC.media.removeClip(S.clips[S.clips.length - 1].id);   // ← こだわりで1本 ✕
      await new Promise(r => setTimeout(r, 400));              // focusNextAction は260ms待つ
      if (opened || U.needsFinishPick()) {
        throw new Error(`外したら門が開いた(tab=${U._setupTab} / 開いた回数=${opened})`);
      }
      /* 降格を止めた以上、pro に閉じ込めない=戻る道(タブ)は出したまま */
      if (d.getElementById("setupTabs").hidden) {
        throw new Error("pro のままなのにタブが隠れている(戻る道が無い)");
      }
      /* 自分でこだわりを選んだ人(_autoFlow=false)は従来どおり easy へ降格する */
      U._autoFlow = false; U.setSetupTab("pro"); U._tabsForced = false;
      U._stepPhase = "mat"; U.refreshSetupTabs();
      eq(U._setupTab, "easy", "本物のこだわりの降格(従来どおり)");
      return `外しても門は閉じたまま(tab=pro維持・開いた回数0)・タブは残る / 本物のこだわりは降格`;

      U._autoFlow = keep.flow; U._tabsForced = keep.forced;
      U._stepPhase = keep.step; U._repickHold = keep.hold; U._viewPhase = keep.view;
      U.setBusy(!!keep.busy);
      U.setSetupTab(keep.tab || "easy");
      U.closeFinishPick();
      compReset(w); U.refreshJourney();
    }
  });

  await test("★「このまま進む」が iPhone SE の初期表示に入る(縦の折り目・変異つき)", async () => {
    /* 2026-08-03 レビュー実測: 縦型・ワイプの3本は中身が 648px あり、
       iOS Safari の実効ビューポート 375×553(iPhone SE2/3)では進むボタンが
       折り目の 71px 下に落ちていた。1タップで自走が始まることだけが
       存在理由の画面で、その的が初期表示に無いのは哲学が効いていないのと同じ。
       ★ 既存の「はみ出さない」試験は**横しか測っていない**(iframeも844pxと背が高い)ので
         すり抜けた。ここは iframe を SE の実寸へ縮めて縦を測る */
    const w = await compEnv();
    const fr = w.frameElement;
    const keepH = fr.style.height, keepW = fr.style.width;
    const S = compReset(w);
    const d = w.document;
    try {
      fr.style.width = "375px"; fr.style.height = "553px";
      const seen = {};
      for (const [mode, layout] of [["vertical", "v3"], ["wipeCam", "wipe"], ["switch", "switch"]]) {
        S.mode = mode; S.layoutId = layout;
        S.clips.forEach((c, i) => { c.name = `IMG_0${140 + i}.MOV`; });
        w.MC.ui._autoFlow = true; w.MC.ui._setupTab = "easy";
        S.finishPicked = false; w.MC.ui._fp = null;
        w.MC.ui.closeFinishPick();
        w.MC.ui.openFinishPick();
        const go = d.getElementById("fpGo").getBoundingClientRect();
        const vh = w.innerHeight;
        seen[mode] = Math.round(go.bottom);
        if (go.bottom > vh + 1 || go.top < 0) {
          throw new Error(`${mode}: 進むボタンが初期表示に無い(下端 ${Math.round(go.bottom)}px > 画面 ${vh}px)`);
        }
        /* ★ 貼り付いたフッタの「下」から中身が覗かないこと(2026-08-03 2巡目レビュー)。
           sticky はスクロールポートの**パディング箱**に貼り付くので、容器に
           padding-bottom があるとフッタが画面下端まで届かず、その窓から
           色カードがフェードも無しに生で見えていた(実測: footBottom 529 / 画面 553、
           隙間のヒットテスト = fp-colors)。中身がスクロールする回だけ見る */
        const sec = d.getElementById("finishPick");
        if (sec.scrollHeight > sec.clientHeight + 1) {
          const fr0 = sec.querySelector(".wp-foot").getBoundingClientRect();
          if (fr0.bottom < vh - 1) {
            const gy = Math.round((fr0.bottom + vh) / 2);
            const under = d.elementFromPoint(Math.round(w.innerWidth / 2), gy);
            const peek = under && under.closest && under.closest("#fpCards, #fpColors, #fpLevels");
            if (peek) {
              throw new Error(`${mode}: フッタの下の隙間(${Math.round(vh - fr0.bottom)}px)から中身が覗く`);
            }
          }
        }
        /* スクロールし切ったとき、色カードがフッタの下に隠れ残らないこと */
        sec.scrollTop = sec.scrollHeight;
        const colors = d.getElementById("fpColors").getBoundingClientRect();
        const foot = sec.querySelector(".wp-foot").getBoundingClientRect();
        if (colors.bottom > foot.top + 1) {
          throw new Error(`${mode}: 末尾まで送っても色カードがボタンの下に隠れる`);
        }
      }
      /* 変異の歯: 貼り付けを外すと(=直す前の姿)、縦型が折り目の下へ落ちる */
      const foot = d.querySelector("#finishPick .wp-foot");
      const keepPos = foot.style.position;
      foot.style.position = "static";
      S.mode = "vertical"; S.layoutId = "v3";
      S.finishPicked = false; w.MC.ui._fp = null;
      w.MC.ui.closeFinishPick(); w.MC.ui.openFinishPick();
      const mutated = d.getElementById("fpGo").getBoundingClientRect();
      const fell = mutated.bottom > w.innerHeight + 1;
      d.querySelector("#finishPick .wp-foot").style.position = keepPos;
      if (!fell) throw new Error("変異(sticky を外す)でも落ちない ─ 試験に歯が無い");
      return `375×553 で進むボタンが見える: 縦型${seen.vertical} / ワイプ${seen.wipeCam} / 自動SW${seen.switch}px ≤ 553 / 変異=落ちる`;
    } finally {
      w.MC.ui.closeFinishPick(); w.MC.ui._autoFlow = false;
      fr.style.width = keepW; fr.style.height = keepH;
      compReset(w);
    }
  });

  /* ============ ㉟ 凍結でデコーダが回収されても、作り直して続きから ============
     (2026-08-02 実機: 書き出し中に画面スリープ → 復帰したら
     "VideoDecoder is not configured" で即死)
     iOS はタブ凍結中に WebCodecs のデコーダを回収する(state が
     unconfigured/closed に戻る)。VideoDecoder.reset() が**まったく同じ状態**を
     作るので、それで実機の症状を合成する。
     ・デコーダ → revive(作り直し+現在位置へseek)で続きから読む
     ・エンコーダ → 作り直さず「画面が消えて中断」を名指し(正直さ優先) */
  group("㉟ 凍結でデコーダが回収されても、作り直して続きから読む");
  /* seek できる偽 cursor(SEQ の実サンプル列を使う)。revive が
     「現在位置の直前RAPへ seek し直す」ことまで見張る */
  const mkSeekCursor = () => {
    const c = { i: 0, seeks: [] };
    c.seek = t => {
      c.seeks.push(t);
      let at = 0;
      for (let j = 0; j < SEQ.arr.length; j++) {
        const s = SEQ.arr[j];
        if (s.is_sync && s.cts / s.timescale <= t + 1e-6) at = j;
      }
      c.i = at;
    };
    c.next = async () => (c.i < SEQ.arr.length
      ? { value: SEQ.arr[c.i++], done: false } : { value: undefined, done: true });
    return c;
  };
  const mkFrozenPipe = async (MCns) => {
    const pipe = new MCns.exporter.VideoPipe({ name: "synth100", duration: S1N / S1FPS });
    pipe.cfg = SEQ.cfg;
    pipe.tsOff = 0;                  // init() を通さないので手で(elst無し素材の体)
    let decoded = 0, derr = null;
    pipe._mkDec = () => new VideoDecoder({ output: f => { decoded++; f.close(); },
                                           error: e => { derr = e; } });
    /* 本物の _newDecoder は frames へ積むが、この試験は枚数だけ見ればよいので
       output を数える版に差し替える(revive が _newDecoder を呼ぶ事実は変えない) */
    pipe._newDecoder = function () { this.decoder = this._mkDec(); this.decoder.configure(this.cfg); this.needKey = true; };
    pipe._newDecoder();
    pipe.cursor = mkSeekCursor();
    pipe.cursor.seek(0);
    return { pipe, nDecoded: () => decoded, derr: () => derr };
  };
  const pumpAll = async pipe => {
    let spins = 0;
    while (!pipe.eof && spins++ < 600) {
      await pipe.pump();
      pipe.frames.length = 0;
      await new Promise(r => setTimeout(r, 2));
    }
    await pipe.decoder.flush().catch(() => {});
  };
  await test("★回収(reset)されても revive して最後まで読める", async () => {
    if (!SEQ) throw new Error("㉑の供給列が無い");
    const MCns = await loadExporterMut();
    const { pipe, nDecoded } = await mkFrozenPipe(MCns);
    /* 途中まで健全に回す */
    for (let i = 0; i < 3; i++) { await pipe.pump(); pipe.frames.length = 0; }
    const before = nDecoded();
    pipe.lastReqUs = 1.0e6;              // 「いま1.0秒を書いている」体
    pipe.decoder.reset();                // ← iOSの回収と同じ状態(unconfigured)
    await pumpAll(pipe);                 // 次の decode が即死するはずの経路
    try { pipe.decoder.close(); } catch (e) {}
    eq(pipe.revives, 1, "作り直しの回数");
    if (!(nDecoded() > before)) throw new Error("revive後に1枚もデコードしていない");
    const sk = pipe.cursor.seeks;
    const last = sk[sk.length - 1];
    if (!(Math.abs(last - 1.0) < 0.35)) throw new Error("現在位置へ seek し直していない: " + last);
    return `reset後に revive 1回・seek(${last.toFixed(2)})・計${nDecoded()}枚`;
  });

  await test("★failHint/exportFailHint: 凍結は専用の案内(「形式が扱えない」に落ちない)", async () => {
    const uiSrc = await (await fetch("../switcher/js/ui.js")).text();
    const pull = name => {
      const m = uiSrc.match(new RegExp(name.replace(".", "\\.") + " = (e|m) => \\{"));
      if (!m) throw new Error(name + " が見つからない");
      /* 本体を「トップレベルの };」まで切り出して実行できる形にする */
      const body = uiSrc.slice(uiSrc.indexOf("=>", m.index));

    const stub = { trimRange: () => [0, 10] };
    const fh = new Function("MC", "return " + pull("MC.ui.failHint"))(stub);
    const eh = new Function("MC", "return " + pull("MC.ui.exportFailHint"))(stub);

    if (!/解析を使い回して/.test(fh(msg))) throw new Error("failHint が専用の案内を出さない: " + fh(msg));
    const out = eh(new Error(msg));
    if (!/解析を使い回して/.test(out)) throw new Error("exportFailHint が専用の案内を出さない: " + out);
    if (/扱えないようです/.test(out)) throw new Error("「形式が扱えない」という間違った案内に落ちている");

  await test("★「同じ演奏か」の閾値: 同一演奏 > DOUBT_CONF > 別演奏 (合成音の実測)", async () => {
    const w = await compEnv();
    const M = w.MC;
    if (!(M.sync.DOUBT_CONF > M.sync.MIN_CONF))
      throw new Error(`DOUBT_CONF(${M.sync.DOUBT_CONF}) が MIN_CONF(${M.sync.MIN_CONF}) 以下`);
    /* 現実に寄せた擬似音楽(実測の根拠は sync.js の DOUBT_CONF 注記):
       同一演奏=同じ旋律・同じテンポを別マイク環境で / 別演奏=旋律もテンポも別 */
    const SR = 8000;
    const music = (durSec, melSeed, bpm, shiftSec, envSeed) => {
      let rng = melSeed >>> 0;
      const rand = () => (rng = (rng * 1664525 + 1013904223) >>> 0) / 2 ** 32;
      const notes = Array.from({ length: Math.ceil(durSec * 4) },
        () => 220 * Math.pow(2, Math.floor(rand() * 12) / 12));
      let rng2 = (envSeed * 2654435761 + 1) >>> 0;
      const rand2 = () => (rng2 = (rng2 * 1664525 + 1013904223) >>> 0) / 2 ** 32;
      const n = durSec * SR, pcm = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const t = i / SR + shiftSec;
        if (t < 1 || t > durSec - 1) continue;
        const beat = t * bpm / 60, env = Math.exp(-4 * (beat % 1));
        const note = notes[Math.max(0, Math.floor(beat)) % notes.length];
        pcm[i] = 0.3 * Math.sin(2 * Math.PI * note * t) * (0.4 + 0.6 * env)
               + 0.22 * env * (rand2() - 0.5);
      }
      const d1 = Math.floor(SR * (0.023 + 0.02 * rand2())), g1 = 0.35;
      for (let i = d1; i < n; i++) pcm[i] += g1 * pcm[i - d1];
      let lp = 0; const a = 0.35 + 0.3 * rand2();
      for (let i = 0; i < n; i++) {
        lp += a * (pcm[i] - lp);
        pcm[i] = Math.max(-0.9, Math.min(0.9, lp + 0.05 * (rand2() - 0.5)));
      }
      return pcm;
    };
    const same = await M.sync.offsetBetween(music(60, 7, 120, 0, 1), music(60, 7, 120, -5, 2));
    const diff = await M.sync.offsetBetween(music(60, 7, 120, 0, 3), music(60, 99, 117, 0, 4));
    if (!(same.conf >= M.sync.DOUBT_CONF))
      throw new Error(`同一演奏が疑われる: conf=${same.conf.toFixed(1)} < ${M.sync.DOUBT_CONF}`);
    if (!(diff.conf < M.sync.DOUBT_CONF))
      throw new Error(`別演奏を見逃す: conf=${diff.conf.toFixed(1)} >= ${M.sync.DOUBT_CONF}`);
    if (Math.abs(same.offset - (-5)) > 0.05)
      throw new Error(`同一演奏のオフセットがずれた: ${same.offset.toFixed(2)}`);
    return `同一=conf ${same.conf.toFixed(1)} / 別=conf ${diff.conf.toFixed(1)} / 閾値 ${M.sync.DOUBT_CONF}`;
  });

      const nClips = S.clips.length;
      U.autoStage.close();
      U.repickLand();
      if (d.body.dataset.mzjPhase !== "mat")
        throw new Error("着地が素材の工程でない: " + d.body.dataset.mzjPhase);
      if (S.clips.length !== nClips) throw new Error("動画が消えた");
      if (!U._repickHold) throw new Error("保留が立たない(外した瞬間に自走が再開してしまう)");
      if (U._repickAfterCancel) throw new Error("着地の印が消えていない(次の「やめる」まで飛ばされる)");
      if (!toasts.some(t => /動画は残って/.test(t))) throw new Error("動画が残る案内が無い: " + toasts.join(" / "));
      return "確認1回・鍵は既存の_autoCancel・着地=素材工程+動画残存+保留";
    } finally {
      w.confirm = keepConfirm; U.toast = keepToast;
      U._autoCancel = false; U._repickAfterCancel = false; U._repickHold = false;
      w.MC.exporter.cancelFlag = false;
      U.autoStage.close(); U._viewPhase = null;
      compReset(w); U.refreshJourney();
    }
  });

  await test("★選び直しの保留: 素材が変わっても自走を再開せず、カードの「選び直す」は外して選ばせる", async () => {
    const w = await compEnv();
    const S = compReset(w);
    const U = w.MC.ui, d = w.document;
    const keepRun = U.runAuto, keepTab = U._setupTab;
    let ran = 0; U.runAuto = () => { ran++; };
    try {
      /* モードは compReset が戻さない。前の試験が wipeCam を残していると、
         保留解除後の focusNextAction が runAuto でなく割り当て画面へ行き、
         「再開1回」を数えられない。ここで switch に固定する */
      U.chooseMode("switch", { silent: true });
      /* ★ _busy も compReset は戻さない(2026-08-02 実測)。前の試験群が
         runAuto 実物を通ると busy が立ったまま残り、この試験の
         「保留を解けば再開する」が busy の鍵で偽FAILになる(群を絞った実行で
         露見。v1.80.0 素のコードでも同じ)。この試験は「着地後・何も
         走っていない」状態の再現なので、前提を自分で作る */
      U.setBusy(false);
      U._autoFlow = true; U._setupTab = "easy"; U._repickHold = true;
      /* ★ 時間で測らない(2026-08-02 実測)。本物は setTimeout(260ms) 越しに走るが、
         隠れタブ/裏iframeではタイマーが何秒も丸められ、固定待ちでは
         「走らなかった」と「まだ走っていない」を区別できない(3回連続で誤FAIL)。
         focusNextAction を呼ぶ間だけ setTimeout を即時実行に差し替えて同期で測る */
      const runNow = fn => {
        const keep = w.setTimeout;
        w.setTimeout = (f, ms) => { f(); return 0; };
        try { fn(); } finally { w.setTimeout = keep; }
      };
      /* 保留中は focusNextAction が自走を再開しない */
      runNow(() => U.focusNextAction());
      if (ran !== 0) throw new Error("保留中なのに自走が再開した");
      /* カードの「この動画を選び直す」= 保留を立ててから外し、ファイル選択を開く */
      U._repickHold = false;   // 押した時点で保留が立つことを見るため一度おろす
      U.renderClips();
      const rp = d.querySelector("#clipSlots .clip-repick");
      if (!rp) throw new Error("カードに「この動画を選び直す」が無い");
      /* モード(S.mode)は compReset が戻さない=前の試験しだいで縦型のことがあり、
         入り口は #fileInput / #fileInputV のどちらにもなる。両方を見張る */
      const fi = d.getElementById("fileInput"), fiV = d.getElementById("fileInputV");
      let picked = 0;
      fi.click = fiV.click = () => { picked++; };
      const n0 = S.clips.length;
      rp.click();
      delete fi.click; delete fiV.click;   // 素のprototypeのclickへ戻す
      if (S.clips.length !== n0 - 1) throw new Error("押した動画が外れていない");
      if (picked !== 1) throw new Error("ファイル選択が開かれない");
      if (!U._repickHold) throw new Error("おまかせなのに保留が立たない(外した瞬間に走り出す)");
      /* 外した直後(afterChange→focusNextAction)も保留が効いて、何も予約されない */
      if (ran !== 0) throw new Error("入れ替えの途中で自走が再開した");
      /* 再開の一手(行動バーの「これでOK、おまかせを再開」相当)。
         ★ 直前にもう一度 busy を下ろす(2026-08-02 実測): 前の試験群が予約した
         setTimeout(() => runAuto(), 260) が裏iframeの節流で**この試験の最中**に
         発火し、本物の runAuto が busy を立て直すことがある(群を絞った実行で
         露見・v1.80.0素のコードでも再現)。清潔な単独iframeでは busy は
         一度も立たないことを確認済み ─ これは製品でなく試験間の漏れ。
         _autoRunning が立ったままだと setBusy(false) は無視される(ui.js:2575
         自走中は鍵を外さない仕様)ので、先にそれを下ろす */
      U._repickHold = false;
      U._autoRunning = false;
      U.setBusy(false);
      /* ★ 素材を外した時点で「仕上げの好み」は選び直しに戻ること(2026-08-03。
         resetEasyDone が finishPicked を倒す ─ 配置の前提が変わるため)。
         この試験は保留の解除そのものを測るので、確かめたうえで選択済みへ戻す */
      if (S.finishPicked) throw new Error("素材を外しても仕上げの好みが選び直しに戻らない");
      S.finishPicked = true;
      runNow(() => U.focusNextAction());
      if (ran !== 1) throw new Error("保留を解いても自走が再開しない: " + ran
        + ` (autoFlow=${U._autoFlow} busy=${U._busy} exp=${!!(w.MC.exporter && w.MC.exporter.running)}`
        + ` easyDone=${S.easyDone} finish=${U.needsFinishPick()})`);
      return "保留中は再開0回・カード=外す+選択+保留・解除で再開1回";
    } finally {
      U.runAuto = keepRun; U._setupTab = keepTab;
      U._autoFlow = false; U._repickHold = false;
      compReset(w); U.refreshJourney();
    }
  });

  if (CF) { CF.remove(); CF = null; CW = null; CD = null; }

  /* ===== 集計 ===== */
  const bad = R.filter(r => !r.ok);
  const scope = MZQA_G.length ? `〔絞り込み: ${MZQA_G.join(",")} — push前は全件を回すこと〕` : "";
  sum.textContent = (bad.length
    ? `FAIL ${bad.length} / ${R.length} — ${bad.map(b => b.name).join(" / ")}`
    : `全 ${R.length} 件 PASS`) + scope;
  sum.style.color = bad.length ? "crimson" : "seagreen";
  window.__MZQA = { total: R.length, failed: bad.length, filtered: MZQA_G, results: R };
  document.title = (bad.length ? `FAIL(${bad.length})` : "PASS") + " — MarchinZ QA";
})();
</script>
